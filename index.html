<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Design brief · Connor Olson Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F2F0;--card:#FFFFFF;--ink:#1C1C1D;--text:#3A3A3D;--muted:#6B6B70;--line:rgba(28,28,29,.12);--chip:#EEEEEA;--accent:#1C1C1D;--on:#F5F5F3;--good:#22B573;--bad:#C83A42;
  --disp:"Cormorant Garamond",Georgia,"Times New Roman",serif;--ui:"Space Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--soft:0 1px 2px rgba(20,20,21,.04),0 10px 30px rgba(20,20,21,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#151516;--card:#222224;--ink:#F3F3F0;--text:#D9D9D5;--muted:#9D9DA2;--line:rgba(245,245,243,.12);--chip:#2E2E31;--accent:#F3F3F0;--on:#1C1C1D;--soft:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 var(--ui);-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px calc(120px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:40px}
.sig{width:132px;height:auto;color:var(--ink);display:block}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--disp);font-style:italic;font-weight:600;font-size:clamp(40px,9vw,60px);line-height:1;letter-spacing:-.02em;color:var(--ink);margin:6px 0 16px}
.lede{font-size:17px;color:var(--text);margin:0 0 6px;white-space:pre-line}
.proj{margin:18px 0 0;display:flex;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--card);box-shadow:var(--soft);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--ink)}
.bar{position:sticky;top:0;z-index:5;margin:28px -16px 18px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px}
.track{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--ink);border-radius:99px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.count{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:22px;box-shadow:var(--soft);padding:22px 20px;margin-bottom:14px}
.card.mood{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
.q{scroll-margin-top:80px}
.qn{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.qn .ok{width:16px;height:16px;border-radius:50%;background:var(--good);color:#fff;display:none;place-items:center;font-size:10px}
.q.done .qn .ok{display:grid}
label.ql,.ql{display:block;font-family:var(--disp);font-style:italic;font-weight:600;font-size:24px;line-height:1.15;color:var(--ink);margin:0 0 4px}
.hint{font-size:13.5px;color:var(--muted);margin:0 0 12px}
input[type=text],input[type=url],input[type=date],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--chip);border:1.5px solid transparent;border-radius:14px;padding:13px 14px;outline:none;transition:border-color .15s,background .15s;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{border-color:var(--ink);background:var(--card)}
textarea{resize:vertical;min-height:110px;line-height:1.5}
input[type=date]{min-height:50px}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chk{position:relative}
.chk input{position:absolute;opacity:0;pointer-events:none}
.chk span{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:var(--chip);font-size:14px;color:var(--ink);cursor:pointer;user-select:none;transition:background .15s,color .15s,transform .1s}
.chk span::before{content:"";width:14px;height:14px;border-radius:4px;border:1.5px solid currentColor;opacity:.5}
.chk input:checked+span{background:var(--accent);color:var(--on)}
.chk input:checked+span::before{opacity:1;background:currentColor;box-shadow:inset 0 0 0 2px var(--accent)}
.chk input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.chk span:active{transform:scale(.97)}
.scale{display:grid;grid-template-columns:minmax(70px,1fr) auto minmax(70px,1fr);align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.scale:first-of-type{border-top:0}
.scale .l{font-size:14px;color:var(--text)}
.scale .r{font-size:14px;color:var(--text);text-align:right}
.dots{display:flex;gap:6px}
.dots button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;padding:0;transition:transform .12s,background .15s,border-color .15s}
.dots button:hover{border-color:var(--ink)}
.dots button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);transform:scale(1.08)}
.dots button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:420px){.scale{grid-template-columns:1fr 1fr;row-gap:8px}.scale .dots{grid-column:1/-1;grid-row:2;justify-content:space-between}.dots button{width:36px;height:36px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;background:var(--accent);color:var(--on);font:500 13px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;padding:16px 26px;cursor:pointer;text-decoration:none;transition:transform .12s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.send{margin-top:26px;text-align:center}
.send .btn{width:min(100%,360px);padding:20px}
.send p{font-size:13px;color:var(--muted);margin:12px 0 0}
.note{font-size:13px;color:var(--muted)}
.saved{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.saved i{width:6px;height:6px;border-radius:50%;background:var(--good)}
.screen{min-height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:12px}
.screen h1{margin-bottom:6px}
.err{background:color-mix(in srgb,var(--bad) 10%,var(--card));border-radius:18px;padding:18px;margin-top:18px;color:var(--ink)}
.err b{display:block;margin-bottom:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes fd{from{opacity:0;transform:translateY(10px)}}
.foot{margin-top:56px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot a{color:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<main class="wrap" id="app" aria-live="polite">
  <div class="top"><svg class="sig" viewBox="0 0 1402 344" role="img" aria-label="Connor Olson Design"><use href="#sig"/></svg><span class="eyebrow">Design brief</span></div>
  <div class="screen"><span class="spin" style="color:var(--muted)"></span></div>
</main>
<script>
(function(){
"use strict";
var app=document.getElementById("app");
var B=null, A={}, KEY="", sending=false, tries=0;
var ENDPOINT_OK=/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function top(){return '<div class="top"><svg class="sig" viewBox="0 0 1402 344" role="img" aria-label="Connor Olson Design"><use href="#sig"/></svg><span class="eyebrow">Design brief</span></div>'}
function b64d(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function decode(h){
  if(!h)throw new Error("empty");
  var kind=h.slice(0,2),body=h.slice(2),bytes=b64d(body),txt;
  if(kind==="z."){if(typeof DecompressionStream==="undefined")throw new Error("old browser");var st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));txt=await new Response(st).text()}
  else if(kind==="j."){txt=new TextDecoder().decode(bytes)}else throw new Error("bad link");
  return JSON.parse(txt);
}
function first(n){return String(n||"").trim().split(/\s+/)[0]||""}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}}
function save(extra){try{localStorage.setItem(KEY,JSON.stringify(Object.assign({a:A,t:Date.now()},extra||{})))}catch(e){}flashSaved()}
var svT;function flashSaved(){var el=document.getElementById("svd");if(!el)return;el.hidden=false;clearTimeout(svT);svT=setTimeout(function(){el.hidden=true},1600)}
function answered(q){var v=A[q.i];if(q.t==="checks")return Array.isArray(v)&&v.length>0;if(q.t==="scales")return Array.isArray(v)&&v.some(function(x){return x});return v!=null&&String(v).trim()!==""}
function progress(){var n=B.q.filter(answered).length,t=B.q.length;var bar=document.querySelector(".track i");if(bar)bar.style.width=(t?n/t*100:0)+"%";var c=document.getElementById("cnt");if(c)c.textContent=n+" of "+t+" answered";
  B.q.forEach(function(q){var el=document.getElementById("q-"+q.i);if(el)el.classList.toggle("done",answered(q))})}
function field(q,k){
  var id="f-"+q.i,v=A[q.i],h=q.h?'<p class="hint">'+esc(q.h)+'</p>':"",head='<div class="qn">'+(k+1)+' of '+B.q.length+'<span class="ok" aria-hidden="true">&#10003;</span></div>';
  if(q.t==="short"||q.t==="url")return '<section class="card q fade" id="q-'+q.i+'" style="animation-delay:'+Math.min(k*40,400)+'ms">'+head+'<label class="ql" for="'+id+'">'+esc(q.l)+'</label>'+h+'<input type="'+(q.t==="url"?"url":"text")+'" id="'+id+'" data-i="'+q.i+'" value="'+esc(v||"")+'" autocomplete="off" '+(q.t==="url"?'inputmode="url" placeholder="https://"':'')+'></section>';
  if(q.t==="date")return '<section class="card q fade" id="q-'+q.i+'">'+head+'<label class="ql" for="'+id+'">'+esc(q.l)+'</label>'+h+'<input type="date" id="'+id+'" data-i="'+q.i+'" value="'+esc(v||"")+'"></section>';
  if(q.t==="long")return '<section class="card q fade" id="q-'+q.i+'">'+head+'<label class="ql" for="'+id+'">'+esc(q.l)+'</label>'+h+'<textarea id="'+id+'" data-i="'+q.i+'" rows="'+(q.r||4)+'">'+esc(v||"")+'</textarea></section>';
  if(q.t==="checks"){var sel=Array.isArray(v)?v:[];return '<section class="card q fade" id="q-'+q.i+'" role="group" aria-labelledby="l-'+q.i+'">'+head+'<span class="ql" id="l-'+q.i+'">'+esc(q.l)+'</span>'+(q.h?h:'<p class="hint">Choose all that apply.</p>')+'<div class="checks">'+(q.o||[]).map(function(o,j){return '<label class="chk"><input type="checkbox" data-i="'+q.i+'" data-j="'+j+'" '+(sel.indexOf(j)>=0?"checked":"")+'><span>'+esc(o)+'</span></label>'}).join("")+'</div></section>'}
  if(q.t==="scales"){var cur=Array.isArray(v)?v:[];return '<section class="card q fade" id="q-'+q.i+'" role="group" aria-labelledby="l-'+q.i+'">'+head+'<span class="ql" id="l-'+q.i+'">'+esc(q.l)+'</span><p class="hint">'+esc(q.h||"For each pair, tap the dot closest to how your project should feel.")+'</p>'+(q.r||[]).map(function(r,ri){return '<div class="scale"><span class="l">'+esc(r[0])+'</span><span class="dots" role="radiogroup" aria-label="'+esc(r[0])+' to '+esc(r[1])+'">'+[1,2,3,4,5].map(function(n){return '<button type="button" role="radio" aria-checked="'+(cur[ri]===n)+'" aria-pressed="'+(cur[ri]===n)+'" aria-label="'+n+' of 5" data-i="'+q.i+'" data-r="'+ri+'" data-v="'+n+'"></button>'}).join("")+'</span><span class="r">'+esc(r[1])+'</span></div>'}).join("")+'</section>'}
  return "";
}
function plain(){return B.q.map(function(q){var v=A[q.i],t="";if(q.t==="checks")t=(Array.isArray(v)?v:[]).map(function(j){return (q.o||[])[j]}).filter(Boolean).join(", ");else if(q.t==="scales")t=(q.r||[]).map(function(r,ri){var x=(Array.isArray(v)?v:[])[ri];return x?r[0]+" ↔ "+r[1]+": "+x+"/5":""}).filter(Boolean).join("; ");else t=v||"";return q.l+"\n"+(t||"(blank)")}).join("\n\n")}
function render(){
  var st=load()||{};A=st.a||{};
  var nm=first(B.c),done=!!st.sent;
  app.innerHTML=top()+
   '<div class="fade"><span class="eyebrow">'+esc(B.p||"Your project")+'</span><h1>'+(nm?"Hi "+esc(nm)+".":"Hi there.")+'</h1><p class="lede">'+esc(B.n||"Thanks for working with me. These questions help me understand your project before I start designing. Answer what you can. Nothing here is a test, and short answers are completely fine.")+'</p>'+
   '<div class="proj"><span class="pill">'+B.q.length+' questions</span><span class="pill">About '+Math.max(3,Math.round(B.q.length*0.8))+' minutes</span><span class="pill">Saves as you go</span></div></div>'+
   (done?'<div class="err" style="background:color-mix(in srgb,var(--good) 12%,var(--card))"><b>You already sent this brief. Thank you!</b>You can change anything below and send it again. Connor will get the updated answers.</div>':"")+
   '<div class="bar"><div class="track" aria-hidden="true"><i></i></div><span class="count" id="cnt"></span><span class="saved" id="svd" hidden><i></i>Saved</span></div>'+
   (B.m?'<section class="card mood fade"><div><span class="qn">Moodboard</span><span class="ql">Add some inspiration</span><p class="hint" style="margin:0">Pin images, colors and anything that feels right.</p></div><a class="btn ghost" href="'+esc(B.m)+'" target="_blank" rel="noopener">Open moodboard</a></section>':"")+
   B.q.map(field).join("")+
   '<div class="send"><button class="btn" id="send" type="button">Send to Connor</button><p id="sendnote">Your answers go straight to Connor. You can come back and update them anytime with this same link.</p><div id="sendmsg"></div></div>'+
   '<div class="foot"><span>Connor Olson Design · Spokane, WA</span>'+(B.e?'<a href="mailto:'+esc(B.e)+'">'+esc(B.e)+'</a>':"")+'</div>';
  progress();
}
function thanks(){
  var nm=first(B.c);window.scrollTo({top:0,behavior:"smooth"});
  app.innerHTML=top()+'<div class="screen fade"><span class="eyebrow">Brief received</span><h1>Thank you'+(nm?", "+esc(nm):"")+'!</h1><p class="lede">Connor has your answers and will be in touch soon about next steps. If you think of anything else, open this same link again to update your brief.</p><div class="row"><button class="btn ghost" id="again" type="button">Review my answers</button></div></div>';
}
async function send(){
  if(sending)return;var btn=document.getElementById("send"),msg=document.getElementById("sendmsg");
  var n=B.q.filter(answered).length;
  if(n===0){msg.innerHTML='<div class="err"><b>Nothing to send yet</b>Answer at least one question, then send.</div>';return}
  sending=true;btn.disabled=true;btn.innerHTML='<span class="spin"></span>Sending';msg.innerHTML="";
  var payload={v:1,id:B.id,k:B.k,client:B.c||"",project:B.p||"",answers:A,text:plain(),sentAt:new Date().toISOString()};
  var ok=false,last="";
  for(tries=0;tries<3&&!ok;tries++){
    try{
      var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort()},20000);
      var r=await fetch(B.u,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),signal:ctl.signal,redirect:"follow"});
      clearTimeout(tm);var j=await r.json().catch(function(){return null});
